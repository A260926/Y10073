[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-chain"
version = "0.1.0"
description = "Offline multi-site immutable sample evidence chain"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
evidence-chain = "evidence_chain.__main__:main"

[tool.setuptools.packages.find]
include = ["evidence_chain*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
